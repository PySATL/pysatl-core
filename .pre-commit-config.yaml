default_language_version:
  python: python3.12

default_install_hook_types: [ pre-commit, commit-msg ]
default_stages: [ pre-commit, pre-push, manual ]

ci:
  autofix_commit_msg: "chore: apply pre-commit fixes"
  autofix_prs: true
  autoupdate_commit_msg: "ci: update pre-commit hooks"
  autoupdate_schedule: quarterly
  skip: [ pyproject-fmt, codespell, ruff, ruff-format, mypy ]

exclude: >
  (?x)^(
    \.git/
    | \.idea/
    | \.venv/
    | venv/
    | build/
    | dist/
    | .*\.egg-info/
    | docs/_build/
    | coverage\.xml
    | \.gitignore$
    | LICENSE$
    | .*\.md$
    | .*\.jpg$
    | subprojects/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: forbid-new-submodules
      - id: mixed-line-ending
        args: [ --fix=lf ]

  - repo: local
    hooks:
      - id: check-git-conventions
        name: check Git branch and commit conventions
        entry: python .github/scripts/check_git_conventions.py
        language: python
        always_run: true
        pass_filenames: false

      - id: check-commit-message
        name: check commit message
        entry: python .github/scripts/check_git_conventions.py --commit-msg
        language: python
        stages: [ commit-msg ]
        always_run: true

      - id: pyproject-fmt
        name: pyproject-fmt
        entry: pyproject-fmt
        language: system
        files: ^pyproject\.toml$

      - id: codespell
        name: codespell
        entry: codespell
        language: system
        exclude: '.*\.ipynb'
        args: [ "-L", "crate,te,ba,ans,fo,nd" ]

      - id: ruff
        name: ruff
        entry: ruff check --fix --unsafe-fixes
        language: system
        types_or: [ python, pyi, jupyter ]

      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        types_or: [ python, pyi, jupyter ]

      - id: mypy
        name: mypy
        entry: mypy --config-file=pyproject.toml
        language: system
        pass_filenames: false
